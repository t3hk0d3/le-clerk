[package]
name = "leclerk"
version = "0.1.0"
edition = "2024"
description = "Local resource-lease broker for AI coding agents"

[lib]
name = "leclerk"
path = "src/lib.rs"

[[bin]]
name = "clerk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs4 = "0.13"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
# MCP (phase 3). Pinned exactly: rmcp 3.x changes wire behaviour between minors.
# rmcp-macros is held at 3.8.0 in Cargo.lock (cargo update -p rmcp-macros --precise 3.8.0).
rmcp = { version = "=3.8.0", features = ["server", "macros", "transport-streamable-http-server", "client", "transport-streamable-http-client-unix-socket"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
ulid = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
